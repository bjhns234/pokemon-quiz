name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # ubuntu-latest is 26.04. Playwright 1.56.1 has no Chromium build for it,
    # so the install step fails before any test runs. 24.04 is the build it ships.
    runs-on: ubuntu-24.04
    # The browser install also downloads fonts. A slow mirror has used the
    # whole 10 minutes and cancelled the job before any test ran.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
