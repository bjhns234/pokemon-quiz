<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokemon Learning Adventure</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#F0F4F8;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 20px 80px}
.wrap{width:100%;max-width:520px}
.logo-ball{margin:0 auto 20px;width:72px;height:72px}
.app-title{font-size:22px;font-weight:700;color:#1A1A2E;margin-bottom:6px}
.app-sub{font-size:14px;color:#6B7280;margin-bottom:28px;line-height:1.5}
#game{display:none}
#pokedex-page{display:none}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.app-name{font-size:15px;font-weight:600;color:#1A1A2E}
.streak-badge{background:#FEF3C7;color:#B45309;font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.pcard{text-align:center}
.pnum{font-size:11px;color:#9CA3AF;margin-bottom:2px;font-weight:500}
.pname{font-size:22px;font-weight:700;color:#1A1A2E}
.psvg{display:flex;justify-content:center;align-items:center;margin:8px 0;animation:float 3s ease-in-out infinite}
.psvg img{display:block}
.psvg.bk{animation:bounce 0.5s ease forwards}
.psvg.sk{animation:shake 0.45s ease forwards}
.psvg.fl{animation:flash 1.6s ease forwards}
.xp-row{display:flex;justify-content:space-between;font-size:11px;color:#9CA3AF;margin-bottom:5px;font-weight:500}
.xp-track{height:10px;background:#F3F4F6;border-radius:999px;overflow:hidden}
.xp-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#FF5722,#FF8A65);transition:width 0.7s cubic-bezier(0.4,0,0.2,1)}
.xp-max{background:linear-gradient(90deg,#F59E0B,#FCD34D)}
.subj-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px;letter-spacing:0.03em}
.tagm{background:#DBEAFE;color:#1D4ED8}
.tagr{background:#D1FAE5;color:#065F46}
.tags{background:#FEF3C7;color:#92400E}
.qtext{font-size:16px;color:#1A1A2E;line-height:1.6;margin-bottom:16px;font-weight:500}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ans-btn{background:#F9FAFB;border:2px solid #E5E7EB;border-radius:12px;padding:14px 10px;font-size:15px;font-weight:600;color:#374151;cursor:pointer;text-align:center;transition:all 0.15s;line-height:1.3;font-family:inherit;width:100%}
.ans-btn:hover:not(:disabled){border-color:#FF5722;color:#FF5722;background:#FFF3E0}
.ans-btn.cor{background:#ECFDF5;border-color:#10B981;color:#065F46}
.ans-btn.wrg{background:#FEF2F2;border-color:#EF4444;color:#991B1B}
.ans-btn:disabled{cursor:default}
.result-msg{text-align:center;padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:8px;font-weight:500}
.result-msg.ok{background:#ECFDF5;color:#065F46}
.result-msg.no{background:#FEF2F2;color:#991B1B}
.nxt-btn{width:100%;background:#1A1A2E;color:white;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.nxt-btn:hover{opacity:0.85}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:12px;padding:10px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.stat-subj{font-size:11px;color:#6B7280;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.04em}
.stat-acc{font-size:15px;font-weight:700;color:#1A1A2E}
.stat-denom{font-size:11px;color:#9CA3AF;font-weight:400}
.stat-bar{height:4px;background:#F3F4F6;border-radius:999px;margin-top:6px;overflow:hidden}
.stat-fill{height:100%;border-radius:999px;background:#60A5FA;transition:width 0.5s ease}
.pdx-gen-section{margin-bottom:16px}
.pdx-gen-label{font-size:11px;font-weight:700;color:#9CA3AF;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px}
.pdx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pdx-entry{background:#fff;border-radius:12px;padding:10px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.pdx-entry.locked{opacity:0.25;filter:grayscale(1)}
.pdx-num{font-size:10px;color:#9CA3AF;font-weight:500}
.pdx-name{font-size:12px;font-weight:700;color:#1A1A2E;margin-top:2px}
.pdx-fact{font-size:10px;color:#6B7280;margin-top:3px;line-height:1.4}
.reset-btn{position:relative;overflow:hidden;border:1px solid #E5E7EB;background:#fff;color:#9CA3AF;font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.reset-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#FECACA}
.reset-lbl{position:relative}
.starter-card{background:#fff;border-radius:16px;padding:16px 14px 20px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.gen-section{margin-bottom:14px}
.gen-label{font-size:11px;font-weight:700;color:#9CA3AF;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;text-align:left}
.starter-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.starter-opt{background:#F9FAFB;border:2px solid #E5E7EB;border-radius:12px;padding:8px 4px 10px;cursor:pointer;transition:all 0.18s;text-align:center;display:flex;flex-direction:column;align-items:center;font-family:inherit}
.starter-opt:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,0.1)}
.fire-opt:hover{border-color:#FF5722;background:#FFF3E0}
.water-opt:hover{border-color:#1976D2;background:#E3F2FD}
.grass-opt:hover{border-color:#16A34A;background:#F0FDF4}
.starter-opt-name{font-size:12px;font-weight:700;color:#1A1A2E;margin-top:5px;margin-bottom:3px}
.starter-opt-type{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;display:inline-block}
.fire-type{background:#FEE2E2;color:#DC2626}
.water-type{background:#DBEAFE;color:#1D4ED8}
.grass-type{background:#DCFCE7;color:#16A34A}
.electric-type{background:#FEF9C3;color:#A16207}
.normal-type{background:#F3F4F6;color:#374151}
.flying-type{background:#E0F2FE;color:#0369A1}
.bug-type{background:#ECFCCB;color:#3F6212}
.fairy-type{background:#FCE7F3;color:#9D174D}
.lvl-badge{display:inline-block;background:#1A1A2E;color:white;font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;margin-left:6px;letter-spacing:0.04em;vertical-align:middle}
.team-row{display:flex;gap:8px;background:#fff;border-radius:14px;padding:10px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);overflow-x:auto;align-items:center}
.team-label{font-size:11px;font-weight:700;color:#9CA3AF;letter-spacing:0.06em;text-transform:uppercase;flex-shrink:0;padding:0 4px 0 2px}
.team-slot{position:relative;flex:0 0 auto;width:54px;height:54px;border-radius:12px;border:2px solid #E5E7EB;background:#F9FAFB;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;padding:0;font-family:inherit}
.team-slot:hover{border-color:#FF5722}
.team-slot.active{border-color:#FF5722;background:#FFF3E0;box-shadow:0 0 0 3px rgba(255,87,34,0.15)}
.team-slot img{width:44px;height:44px;object-fit:contain;display:block;pointer-events:none}
.team-slot-lvl{position:absolute;bottom:-4px;right:-5px;background:#1A1A2E;color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;line-height:1.4}
.catch-pips{display:flex;justify-content:center;gap:8px;margin-top:10px}
.catch-pip{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.4);transition:all 0.2s ease}
.catch-pip.filled{background:#86efac;border-color:#86efac;box-shadow:0 0 8px rgba(134,239,172,0.6)}
.catch-balls{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:9px}
.catch-balls-lbl{font-size:11px;font-weight:600;color:rgba(255,255,255,0.6);margin-right:3px}
.miss-ball{width:15px;height:15px;border-radius:50%;background:linear-gradient(#EF4444 0 49%,#fff 51% 100%);border:1.5px solid rgba(0,0,0,0.45);transition:all 0.2s ease}
.miss-ball.used{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.22);opacity:0.5}
.lvl-up-toast{background:linear-gradient(90deg,#FCD34D,#F59E0B);color:#1A1A2E;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700;margin-bottom:12px;text-align:center;box-shadow:0 4px 14px rgba(245,158,11,0.35);animation:lvl-up-flash 0.55s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes lvl-up-flash{0%{opacity:0;transform:translateY(-10px) scale(0.92)}40%{opacity:1;transform:translateY(0) scale(1.06)}70%{transform:scale(0.98)}100%{opacity:1;transform:scale(1)}}
.wild-card{background:linear-gradient(145deg,#0f2f0f,#1e4d1e);border-radius:16px;padding:16px 16px 12px;margin-bottom:12px;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,0.25)}
.wild-badge{font-size:11px;font-weight:700;color:#86efac;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px}
.wild-name{font-size:18px;font-weight:700;color:white;margin-bottom:2px}
.catch-counter{display:inline-block;background:rgba(255,255,255,0.15);color:white;font-size:12px;font-weight:600;padding:4px 14px;border-radius:20px;margin-top:8px}
#bottom-nav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;flex-direction:row;background:white;border-top:1px solid #E5E7EB;z-index:100}
.nav-tab{flex:1;background:none;border:none;border-top:2px solid transparent;padding:12px 8px 10px;font-size:14px;font-weight:600;color:#9CA3AF;cursor:pointer;font-family:inherit;transition:color 0.15s}
.nav-tab.nav-active{color:#1A1A2E;border-top-color:#1A1A2E}
#catch-overlay{display:none;position:fixed;inset:0;background:linear-gradient(180deg,#0d2b0d,#1a4a1a 55%,#2a5e2a);z-index:999;flex-direction:column;align-items:center;justify-content:center}
#catch-overlay.active{display:flex}
#catch-pkm{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:200px;height:200px}
#catch-pkm img{display:block;object-fit:contain;width:180px;height:180px}
#catch-ball{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:3;display:none}
#catch-lbl{position:relative;z-index:2;color:white;font-size:18px;font-weight:700;margin-top:24px;text-align:center;padding:0 28px;text-shadow:0 0 20px rgba(255,255,255,0.4);animation:evo-label-in 0.3s ease}
#evo-overlay{display:none;position:fixed;inset:0;background:#06061a;z-index:999;flex-direction:column;align-items:center;justify-content:center}
#evo-overlay.active{display:flex}
#evo-rays{position:absolute;width:160%;height:160%;top:-30%;left:-30%;background:repeating-conic-gradient(rgba(255,255,255,0.055) 0deg 5deg,transparent 5deg 10deg);animation:evo-spin 7s linear infinite;pointer-events:none}
#evo-bg-white{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}
#evo-sprite-wrap{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:220px;height:220px}
#evo-sprite-wrap img{display:block;object-fit:contain;width:200px;height:200px}
#evo-label{position:relative;z-index:2;color:white;font-size:17px;font-weight:700;margin-top:28px;text-align:center;letter-spacing:0.02em;padding:0 24px;text-shadow:0 0 24px rgba(255,255,255,0.6);animation:evo-label-in 0.3s ease}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bounce{0%,100%{transform:scale(1)}30%{transform:scale(1.18) rotate(-3deg)}65%{transform:scale(0.95)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
@keyframes flash{0%,100%{filter:brightness(1)}40%{filter:brightness(5) saturate(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes pop{0%{opacity:0;transform:scale(0.85) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes lvlup{0%{opacity:0;transform:scale(0.7)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes evo-spin{to{transform:rotate(360deg)}}
@keyframes evo-label-in{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes ball-fly{0%{transform:translateX(-50%) translateY(170px) scale(0.3) rotate(-540deg);opacity:0}65%{opacity:1}100%{transform:translateX(-50%) translateY(0) scale(1) rotate(0deg);opacity:1}}
@keyframes ball-wobble-seq{0%,100%{transform:translateX(-50%) rotate(0deg)}5%{transform:translateX(-50%) rotate(-24deg)}10%{transform:translateX(-50%) rotate(22deg)}14%{transform:translateX(-50%) rotate(-12deg)}18%{transform:translateX(-50%) rotate(8deg)}22%{transform:translateX(-50%) rotate(0deg)}38%{transform:translateX(-50%) rotate(20deg)}43%{transform:translateX(-50%) rotate(-22deg)}47%{transform:translateX(-50%) rotate(11deg)}51%{transform:translateX(-50%) rotate(-6deg)}55%{transform:translateX(-50%) rotate(0deg)}71%{transform:translateX(-50%) rotate(-19deg)}76%{transform:translateX(-50%) rotate(19deg)}80%{transform:translateX(-50%) rotate(-9deg)}84%{transform:translateX(-50%) rotate(5deg)}88%{transform:translateX(-50%) rotate(0deg)}}
@keyframes pkm-absorb{0%{transform:scale(1) rotate(0deg);filter:brightness(1) saturate(1);opacity:1}25%{transform:scale(1.12) rotate(-6deg);filter:brightness(1.8) saturate(0.6);opacity:1}55%{transform:scale(0.55) rotate(180deg);filter:brightness(3) saturate(0) invert(1);opacity:0.7}100%{transform:scale(0.04) rotate(540deg);filter:brightness(0) invert(1);opacity:0}}
@keyframes ball-pop{0%{transform:translateX(-50%) scale(1) rotate(0deg)}40%{transform:translateX(-50%) scale(1.22) rotate(0deg)}100%{transform:translateX(-50%) scale(1) rotate(0deg)}}
@keyframes sparkle-fly{0%{opacity:0;transform:translate(-50%,50%) scale(0.3)}12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(50% + var(--dy))) scale(1.4)}}
.sparkle{position:absolute;left:50%;bottom:38px;width:10px;height:10px;background:#FCD34D;border-radius:50%;box-shadow:0 0 14px 3px #FCD34D,0 0 30px 6px rgba(252,211,77,0.5);opacity:0;pointer-events:none;z-index:4}
.sparkle.s2{background:#FFFFFF;box-shadow:0 0 14px 3px #FFFFFF,0 0 30px 6px rgba(255,255,255,0.6)}
.sparkle.s3{background:#FCA5A5;box-shadow:0 0 14px 3px #FCA5A5,0 0 28px 6px rgba(252,165,165,0.5)}
</style>
</head>
<body>
<div class="wrap">


<div id="game"></div>
<div id="pokedex-page"></div>

<div id="bottom-nav">
  <button class="nav-tab nav-active" id="nav-game">&#127918; Game</button>
  <button class="nav-tab" id="nav-pdx">&#128218; Pokédex</button>
</div>

</div>

<div id="catch-overlay">
  <div id="catch-pkm"><img id="catch-pkm-img" src="" alt=""><div id="catch-ball"></div></div>
  <div id="catch-lbl"></div>
</div>

<div id="evo-overlay">
  <div id="evo-rays"></div>
  <div id="evo-bg-white"></div>
  <div id="evo-sprite-wrap"><img id="evo-img" src="" alt=""></div>
  <div id="evo-label"></div>
</div>

<script>
const BASE="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/";
function pkImg(id,s){return`<img src="${BASE}${id}.png" width="${s}" height="${s}" alt="" style="object-fit:contain;display:block">`}

const PKM=[
// Gen 1 — Kanto
{n:"Bulbasaur",num:"#001",type:["Grass","Poison"],evoAt:16,svg:s=>pkImg(1,s),fact:"Bulbasaur has a plant bulb on its back that grows bigger as it gets stronger!"},
{n:"Ivysaur",num:"#002",type:["Grass","Poison"],evoAt:32,svg:s=>pkImg(2,s),fact:"The bulb on Ivysaur's back bloomed into a beautiful sweet-smelling flower!"},
{n:"Venusaur",num:"#003",type:["Grass","Poison"],evoAt:null,svg:s=>pkImg(3,s),fact:"Venusaur's giant flower soaks up sunlight to power its amazing attacks!"},
{n:"Charmander",num:"#004",type:"Fire",evoAt:16,svg:s=>pkImg(4,s),fact:"The flame on Charmander's tail shows how healthy and strong it is — it never goes out!"},
{n:"Charmeleon",num:"#005",type:"Fire",evoAt:36,svg:s=>pkImg(5,s),fact:"When Charmeleon gets excited, its tail flame turns a blazing bright blue!"},
{n:"Charizard",num:"#006",type:["Fire","Flying"],evoAt:null,svg:s=>pkImg(6,s),fact:"Charizard soars through the sky and breathes scorching hot orange fire!"},
{n:"Squirtle",num:"#007",type:"Water",evoAt:16,svg:s=>pkImg(7,s),fact:"Squirtle's round shell is super tough and can bounce off attacks like a shield!"},
{n:"Wartortle",num:"#008",type:"Water",evoAt:36,svg:s=>pkImg(8,s),fact:"Wartortle's fluffy tail helps it balance perfectly while swimming in water!"},
{n:"Blastoise",num:"#009",type:"Water",evoAt:null,svg:s=>pkImg(9,s),fact:"Blastoise has powerful cannons built into its shell that shoot jet-streams of water!"},
// Gen 2 — Johto
{n:"Chikorita",num:"#152",type:"Grass",evoAt:16,svg:s=>pkImg(152,s),fact:"Chikorita uses the sweet-smelling leaf on its head to check the weather!"},
{n:"Bayleef",num:"#153",type:"Grass",evoAt:32,svg:s=>pkImg(153,s),fact:"The ring of leaves around Bayleef's neck have a spicy, energizing smell!"},
{n:"Meganium",num:"#154",type:"Grass",evoAt:null,svg:s=>pkImg(154,s),fact:"Meganium's flower breath has a soothing power that calms down angry Pokémon!"},
{n:"Cyndaquil",num:"#155",type:"Fire",evoAt:14,svg:s=>pkImg(155,s),fact:"Cyndaquil is shy and protects itself with fire that flares up on its back!"},
{n:"Quilava",num:"#156",type:"Fire",evoAt:36,svg:s=>pkImg(156,s),fact:"Quilava's head and tail flames can reach incredibly hot temperatures!"},
{n:"Typhlosion",num:"#157",type:"Fire",evoAt:null,svg:s=>pkImg(157,s),fact:"Typhlosion creates heat shimmer waves to hide itself before unleashing fire!"},
{n:"Totodile",num:"#158",type:"Water",evoAt:18,svg:s=>pkImg(158,s),fact:"Totodile's powerful jaws are so strong they can crush almost anything, even rocks!"},
{n:"Croconaw",num:"#159",type:"Water",evoAt:30,svg:s=>pkImg(159,s),fact:"When Croconaw loses a tooth in battle, a brand new one grows right back!"},
{n:"Feraligatr",num:"#160",type:"Water",evoAt:null,svg:s=>pkImg(160,s),fact:"Feraligatr runs incredibly fast on land despite having such a huge, powerful body!"},
// Gen 3 — Hoenn
{n:"Treecko",num:"#252",type:"Grass",evoAt:16,svg:s=>pkImg(252,s),fact:"Treecko can walk straight up walls and across ceilings using sticky pads on its feet!"},
{n:"Grovyle",num:"#253",type:"Grass",evoAt:36,svg:s=>pkImg(253,s),fact:"Grovyle leaps between treetops so fast that it's almost impossible to see!"},
{n:"Sceptile",num:"#254",type:"Grass",evoAt:null,svg:s=>pkImg(254,s),fact:"The seeds on Sceptile's back are packed with nutrients that help forests grow!"},
{n:"Torchic",num:"#255",type:"Fire",evoAt:16,svg:s=>pkImg(255,s),fact:"Torchic breathes fire at 1,800 degrees from its tiny little beak!"},
{n:"Combusken",num:"#256",type:["Fire","Fighting"],evoAt:36,svg:s=>pkImg(256,s),fact:"Combusken can deliver blazing kicks at the incredible rate of ten per second!"},
{n:"Blaziken",num:"#257",type:["Fire","Fighting"],evoAt:null,svg:s=>pkImg(257,s),fact:"Blaziken can leap over tall skyscrapers with its powerful legs of fire!"},
{n:"Mudkip",num:"#258",type:"Water",evoAt:16,svg:s=>pkImg(258,s),fact:"Mudkip uses the large fin on its head to sense changes in water currents!"},
{n:"Marshtomp",num:"#259",type:["Water","Ground"],evoAt:36,svg:s=>pkImg(259,s),fact:"Marshtomp can walk on land and swim through water with equal speed!"},
{n:"Swampert",num:"#260",type:["Water","Ground"],evoAt:null,svg:s=>pkImg(260,s),fact:"Swampert can drag a giant boulder weighing a ton with just one of its arms!"},
// Gen 4 — Sinnoh
{n:"Turtwig",num:"#387",type:"Grass",evoAt:18,svg:s=>pkImg(387,s),fact:"Turtwig's shell is made of hardened soil and grows stronger with each passing day!"},
{n:"Grotle",num:"#388",type:"Grass",evoAt:32,svg:s=>pkImg(388,s),fact:"Grotle carries small bushes on its back and gives Pokémon a shady rest spot!"},
{n:"Torterra",num:"#389",type:["Grass","Ground"],evoAt:null,svg:s=>pkImg(389,s),fact:"Small Pokémon make their homes on Torterra's enormous back — like a walking island!"},

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
const QUEUES={};
SUBS.forEach(sub=>{QUEUES[sub]={};[1,2,3].forEach(lv=>{QUEUES[sub][lv]=shuffle(QB[sub][lv].map((_,i)=>i));});});
function pickBuiltIn(sub,level,pname){
  if(QUEUES[sub][level].length===0) QUEUES[sub][level]=shuffle(QB[sub][level].map((_,i)=>i));
  const idx=QUEUES[sub][level].shift();
  const raw=QB[sub][level][idx];
  const fill=s=>s.replace(/\{P\}/g,pname);
  return{subject:sub,question:fill(raw[0]),answers:raw[1].map(fill),correctIndex:raw[2],encouragement:raw[3],hint:fill(raw[4])};
}

// ---- save / restore -------------------------------------------------------
// Only durable progress is stored. In-flight question, wild encounter,
// pending evolution, streak and toasts are all rebuilt fresh on load.
const SAVE_KEY='pkq-save';
const SAVE_V=1;
const NUM_TO_PI={};PKM.forEach((p,i)=>{NUM_TO_PI[p.num]=i;});

function save(){
  if(st.team.length===0)return; // nothing to restore yet; don't write a stub save
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      v:SAVE_V,
      starter:st.starter,
      activeIdx:st.activeIdx,
      // keyed by dex number, not array index, so PKM can grow without
      // silently remapping someone's team onto the wrong Pokemon
      team:st.team.map(t=>({num:PKM[t.pi].num,level:t.level,xp:t.xp})),
      dex:st.pdx.map((caught,i)=>caught?PKM[i].num:null).filter(Boolean),
      stats:st.stats,
    }));
  }catch(e){/* storage full or unavailable — keep playing unsaved */}
}

function clearSave(){
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
}

function loadSaved(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return null;
    const data=JSON.parse(raw);
    if(!data||data.v!==SAVE_V)return null;

    const team=(data.team||[]).map(t=>{
      const pi=NUM_TO_PI[t&&t.num];
      if(pi===undefined)return null;
      return{pi,level:Math.max(1,t.level|0),xp:Math.max(0,t.xp|0)};
    }).filter(Boolean);
    if(team.length===0)return null;

    const pdx=new Array(PKM.length).fill(false);
    (data.dex||[]).forEach(n=>{const pi=NUM_TO_PI[n];if(pi!==undefined)pdx[pi]=true;});
    team.forEach(t=>{pdx[t.pi]=true;});

    const stats={};
    SUBS.forEach(sub=>{
      const s=(data.stats||{})[sub]||{};
      stats[sub]={
        cor:Math.max(0,s.cor|0),
        att:Math.max(0,s.att|0),
        level:Math.min(3,Math.max(1,s.level|0)),
        cs:Math.max(0,s.cs|0),
        ws:Math.max(0,s.ws|0),
      };
    });

    return{
      starter:typeof data.starter==='number'?data.starter:null,
      activeIdx:Math.min(Math.max(0,data.activeIdx|0),team.length-1),
      team,pdx,stats,
    };
  }catch(e){
    // corrupt or half-written save: start fresh rather than fail to a blank screen
    return null;
  }
}

  if(!qText)return;
  st.recentQs.push(qText);
  while(st.recentQs.length>RECENT_Q_LIMIT)st.recentQs.shift();
}

}

  let h=`<div class="stats-row">`;
  SUBS.forEach(sub=>{const s=st.stats[sub];const p2=accPct(s);h+=`<div class="stat-card"><div class="stat-subj">${SNAME[sub]}</div><div class="stat-acc">${s.cor}<span class="stat-denom">/${s.att}</span></div><div class="stat-bar"><div class="stat-fill" style="width:${p2}%"></div></div></div>`;});
  return h+`</div>`;
}

function render(){
  const hdr=`<div class="hdr"><span class="app-name">Pokémon Learning Adventure</span>${st.streak>1?`<span class="streak-badge">Streak: ${st.streak}</span>`:''}</div>`;
  let h=hdr;

  if(st.phase==='starter'){
    h+=`<div class="starter-card"><div style="font-size:20px;font-weight:700;color:#1A1A2E;margin-bottom:3px;text-align:center">Choose your starter!</div><div style="font-size:13px;color:#6B7280;margin-bottom:16px;text-align:center">Pick your partner for this learning adventure</div>`;
    GENS.forEach((genLines,gi)=>{
      h+=`<div class="gen-section"><div class="gen-label">Gen ${GEN_ROMAN[gi]} &mdash; ${GEN_NAMES[gi]}</div><div class="starter-row">`;
      genLines.forEach(li=>{
        const pk=PKM[LINES[li][0]];
        h+=`<button class="starter-opt ${typeOptClass(pk.type)}" id="pick-${li}">${pk.svg(64)}<div class="starter-opt-name">${pk.n}</div><span class="starter-opt-type ${typeClass(pk.type)}">${typeEmoji(pk.type)} ${typeLabel(pk.type)}</span></button>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div>`;
    gameEl.innerHTML=h;
    GENS.forEach(genLines=>{genLines.forEach(li=>{document.getElementById(`pick-${li}`).addEventListener('click',()=>pickStarter(li));});});
    return;
  }

  if(st.phase==='play'){
    const tm=activeTM();
    const p=PKM[tm.pi];
    const xpMx=xpToNext(tm.level);
    const pct=Math.min(100,Math.round(tm.xp/xpMx*100));
    h+=`<div class="card pcard"><div class="pnum">${p.num} &bull; ${typeBadgesInline(p.type)} Type</div><div class="pname">${p.n} <span class="lvl-badge">Lv ${tm.level}</span></div><div class="psvg ${st.anim}">${p.svg(148)}</div><div class="xp-row"><span>XP</span><span>${tm.xp}/${xpMx}</span></div><div class="xp-track"><div class="xp-fill" style="width:${pct}%"></div></div></div>`;
    if(st.lvlUpMsg){
      h+=`<div class="lvl-up-toast">&#11088; ${st.lvlUpMsg}</div>`;
    }
    if(st.team.length>1){
      h+=`<div class="team-row"><span class="team-label">Team</span>`;
      st.team.forEach((mem,i)=>{
        const mp=PKM[mem.pi];
        h+=`<button class="team-slot${i===st.activeIdx?' active':''}" data-team-idx="${i}" title="${mp.n} Lv ${mem.level}">${mp.svg(44)}<span class="team-slot-lvl">${mem.level}</span></button>`;
      });
      h+=`</div>`;
    }
    const rm=st.cor?(st.q?.encouragement||'Amazing!'):(st.q?.hint||'Good try!');
    const willEvolve=!!st.pendingEvo;
    const btn=willEvolve?`What's happening to ${p.n}?! &#8594;`:'Next Question &#8594;';
    h+=qCardHTML(rm,btn);
  }

  if(st.phase==='wild'&&st.wild){
    const wild=PKM[st.wild.pi];
    const cs=st.wild.correctStreak;
    const misses=st.wild.misses||0;
    const totalBalls=CATCH_MISSES_ALLOWED+1;
    const pips='<div class="catch-pips">'+[0,1,2].map(i=>`<div class="catch-pip${i<cs?' filled':''}"></div>`).join('')+'</div>';
    // Progress is no longer "in a row" — a miss costs a ball but keeps the count.
    // spent balls drop off the right, so the ones still in hand stay left-aligned
    const balls='<div class="catch-balls"><span class="catch-balls-lbl">Pok&eacute; Balls</span>'+
      Array.from({length:totalBalls},(_,i)=>`<div class="miss-ball${i>=totalBalls-misses?' used':''}"></div>`).join('')+'</div>';
    h+=`<div class="wild-card"><div class="wild-badge">&#9889; Wild Encounter</div><div class="wild-name">A wild <strong>${wild.n}</strong> appeared! <span class="lvl-badge">Lv ${st.wild.level}</span></div><div class="psvg ${st.anim}">${wild.svg(140)}</div><div class="catch-counter">Answer ${CATCH_STREAK_NEEDED} to catch it! (${cs}/${CATCH_STREAK_NEEDED})</div>${pips}${balls}</div>`;
    const escaped=st.wildEscape;
    const caught=cs>=CATCH_STREAK_NEEDED;
    const rm=escaped?`${wild.n} broke free and ran away!`:caught?`&#9889; Gotcha! ${wild.n} was caught!`:st.cor?`Great answer! Keep going!`:`${wild.n} broke free! ${st.q?.hint||'Try again!'}`;
    const btn=escaped?'Continue &#8594;':caught?'Catch it! &#8594;':st.cor?'Next Question &#8594;':'Try Again &#8594;';
    h+=qCardHTML(rm,btn);
  }

  h+=statsHTML();
  gameEl.innerHTML=h;
  gameEl.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>handleAnswer(+b.dataset.i)));
  gameEl.querySelectorAll('[data-team-idx]').forEach(b=>b.addEventListener('click',()=>switchPokemon(+b.dataset.teamIdx)));
  const nb=gameEl.querySelector('#nxt');if(nb)nb.addEventListener('click',onNext);
}

function renderPokedex(){
  let h=`<div class="hdr"><span class="app-name">Pokédex</span><button class="reset-btn" id="reset-btn"><span class="reset-fill" id="reset-fill"></span><span class="reset-lbl" id="reset-lbl">Hold to start over</span></button></div>`;
  GENS.forEach((genLines,gi)=>{
    h+=`<div class="pdx-gen-section"><div class="pdx-gen-label">Gen ${GEN_ROMAN[gi]} &mdash; ${GEN_NAMES[gi]}</div><div class="pdx-grid">`;
    genLines.forEach(li=>{
      LINES[li].forEach(pi=>{
        const pk=PKM[pi];const u=st.pdx[pi];
        h+=`<div class="pdx-entry${u?'':' locked'}">${pk.svg(52)}<div class="pdx-num">${pk.num}</div><div class="pdx-name">${u?pk.n:'???'}</div>${u?`<div class="pdx-fact">${pk.fact}</div>`:''}</div>`;
      });
    });
    (WILD_PDX_BY_GEN[gi]||[]).forEach(pi=>{
      const pk=PKM[pi];const u=st.pdx[pi];
      h+=`<div class="pdx-entry${u?'':' locked'}">${pk.svg(52)}<div class="pdx-num">${pk.num}</div><div class="pdx-name">${u?pk.n:'???'}</div>${u?`<div class="pdx-fact">${pk.fact}</div>`:''}</div>`;
    });
    h+=`</div></div>`;
  });
  pdxEl.innerHTML=h;
  wireReset();
}

// Held rather than tapped so a stray finger can't wipe the Pokedex.
function wireReset(){
  const btn=document.getElementById('reset-btn');
  if(!btn)return;
  const fill=document.getElementById('reset-fill');
  const lbl=document.getElementById('reset-lbl');
  const HOLD=2000;
  let timer=null,raf=null,t0=0;
  function stop(){
    if(timer){clearTimeout(timer);timer=null;}
    if(raf){cancelAnimationFrame(raf);raf=null;}
    fill.style.width='0%';
    lbl.textContent='Hold to start over';
  }
  function tick(){
    const p=Math.min(1,(Date.now()-t0)/HOLD);
    fill.style.width=(p*100)+'%';
    if(p<1)raf=requestAnimationFrame(tick);
  }
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(timer)return;
    t0=Date.now();
    lbl.textContent='Keep holding…';
    raf=requestAnimationFrame(tick);
    timer=setTimeout(()=>{
      stop();
      clearSave();
      st=mkState();
      switchView('game');
      render();
    },HOLD);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
}

function switchView(v){
  view=v;
  document.getElementById('nav-game').classList.toggle('nav-active',v==='game');
  document.getElementById('nav-pdx').classList.toggle('nav-active',v==='pdx');
  if(v==='game'){
    gameEl.style.display='block';
    pdxEl.style.display='none';
  } else {
    gameEl.style.display='none';
    pdxEl.style.display='block';
    renderPokedex();
  }
}


async function loadQuestion(){
  const sub=SUBS[Math.floor(Math.random()*3)];
  const lv=st.stats[sub].level;
  const pname=st.phase==='wild'&&st.wild?PKM[st.wild.pi].n:PKM[activePi()].n;
  st.wildEscape=false;
  st.lvlUpMsg=null;
  const q=pickBuiltIn(sub,lv,pname);
  st.q=q;st.sel=null;st.cor=false;st.anim="";
  recordRecent(q.question);
  render();
}

function playEvolution(fromIdx,toIdx,onDone){
  const ov=document.getElementById('evo-overlay');
  const img=document.getElementById('evo-img');
  const lbl=document.getElementById('evo-label');
  const bgw=document.getElementById('evo-bg-white');
  const fromP=PKM[fromIdx],toP=PKM[toIdx];
  const fromId=parseInt(fromP.num.slice(1)),toId=parseInt(toP.num.slice(1));
  ov.classList.add('active');
  img.style.cssText='display:block;object-fit:contain;width:200px;height:200px;filter:none;transition:none';
  img.src=`${BASE}${fromId}.png`;
  lbl.textContent=`What?! ${fromP.n} is evolving!`;
  bgw.style.cssText='position:absolute;inset:0;background:white;opacity:0;pointer-events:none;transition:none';
  const halfCycles=[170,150,130,110,90,75,60,50,42,38];
  let hi=0,isWhite=false;
  function flash(){
    if(hi>=halfCycles.length){
      img.style.filter='brightness(0) invert(1)';
      bgw.style.transition='opacity 0.22s ease';bgw.style.opacity='1';
      setTimeout(()=>{
        img.src=`${BASE}${toId}.png`;img.style.transition='none';img.style.filter='brightness(0) invert(1)';
        lbl.textContent=`${toP.n}!`;
        bgw.style.transition='opacity 0.35s ease';bgw.style.opacity='0';
        setTimeout(()=>{
          img.style.transition='filter 1.3s ease-out';img.offsetWidth;img.style.filter='brightness(1) saturate(1)';
          setTimeout(()=>{
            ov.style.transition='opacity 0.45s ease';ov.style.opacity='0';
            setTimeout(()=>{ov.classList.remove('active');ov.style.cssText='';img.style.cssText='';onDone();},450);
          },1400);
        },380);
      },250);
      return;
    }
    isWhite=!isWhite;
    img.style.filter=isWhite?'brightness(0) invert(1)':'brightness(1) saturate(1)';
    if(!isWhite)hi++;
    setTimeout(flash,halfCycles[Math.min(hi,halfCycles.length-1)]);
  }
  flash();
}

let _audioCtx=null;
function _getAudioCtx(){
  if(!_audioCtx){
    try{_audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
  }
  if(_audioCtx.state==='suspended'){_audioCtx.resume();}
  return _audioCtx;
}
function _tone(f,dur,type='sine',vol=0.14,when=0){
  const ctx=_getAudioCtx();if(!ctx)return;
  const t0=ctx.currentTime+when;
  const osc=ctx.createOscillator(),g=ctx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g);g.connect(ctx.destination);
  osc.start(t0);osc.stop(t0+dur+0.05);
}
function _sweep(f1,f2,dur,type='sine',vol=0.14){
  const ctx=_getAudioCtx();if(!ctx)return;
  const t0=ctx.currentTime;
  const osc=ctx.createOscillator(),g=ctx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(f1,t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g);g.connect(ctx.destination);
  osc.start(t0);osc.stop(t0+dur+0.05);
}
function playSfx(name){
  if(name==='throw'){_sweep(880,260,0.42,'triangle',0.12);}
  else if(name==='capture'){_sweep(360,140,0.32,'sine',0.18);}
  else if(name==='wobble'){_tone(520,0.06,'square',0.09);_tone(380,0.08,'square',0.07,0.04);}
  else if(name==='gotcha'){
    _tone(523,0.13,'triangle',0.18,0);
    _tone(659,0.13,'triangle',0.18,0.12);
    _tone(784,0.13,'triangle',0.18,0.24);
    _tone(1047,0.32,'triangle',0.2,0.36);
  }
}

function _spawnSparkles(host){
  host.querySelectorAll('.sparkle').forEach(s=>s.remove());
  const N=14;
  for(let i=0;i<N;i++){
    const angle=(i/N)*Math.PI*2+(Math.random()*0.4-0.2);
    const dist=70+Math.random()*60;
    const dx=Math.cos(angle)*dist;
    const dy=-Math.sin(angle)*dist;
    const s=document.createElement('div');
    const variant=i%3===0?' s2':i%3===1?' s3':'';
    s.className='sparkle'+variant;
    s.style.setProperty('--dx',dx+'px');
    s.style.setProperty('--dy',dy+'px');
    const dur=(0.7+Math.random()*0.45).toFixed(2);
    const delay=(Math.random()*0.12).toFixed(2);
    s.style.animation=`sparkle-fly ${dur}s ease-out ${delay}s forwards`;
    host.appendChild(s);
  }
}

function playCatch(pkIdx,onDone){
  const ballSVG=`<svg width="56" height="56" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="28" fill="#EF4444" stroke="#1A1A2E" stroke-width="3"/><rect x="2" y="27" width="56" height="6" fill="#1A1A2E"/><circle cx="30" cy="30" r="28" fill="none" stroke="#1A1A2E" stroke-width="3"/><circle cx="30" cy="30" r="10" fill="white" stroke="#1A1A2E" stroke-width="3"/><circle cx="30" cy="30" r="5" fill="#F3F4F6"/></svg>`;
  const ov=document.getElementById('catch-overlay');
  const pkmImg=document.getElementById('catch-pkm-img');
  const ball=document.getElementById('catch-ball');
  const lbl=document.getElementById('catch-lbl');
  const sparkleHost=document.getElementById('catch-pkm');
  const pkId=parseInt(PKM[pkIdx].num.slice(1));
  ov.style.cssText='';ov.style.opacity='1';ov.classList.add('active');
  sparkleHost.querySelectorAll('.sparkle').forEach(s=>s.remove());
  pkmImg.src=`${BASE}${pkId}.png`;
  pkmImg.style.cssText='display:block;object-fit:contain;width:180px;height:180px;filter:none;transition:none;transform:none;opacity:1;animation:none';
  ball.innerHTML=ballSVG;ball.style.display='none';ball.style.animation='none';
  lbl.textContent=`A wild ${PKM[pkIdx].n} appeared!`;
  setTimeout(()=>{
    ball.style.display='block';ball.offsetWidth;
    ball.style.animation='ball-fly 0.75s cubic-bezier(0.15,0.5,0.5,1) forwards';
    playSfx('throw');
    setTimeout(()=>{
      pkmImg.style.cssText='display:block;object-fit:contain;width:180px;height:180px;animation:pkm-absorb 0.55s ease-in forwards';
      playSfx('capture');
      lbl.textContent='...';
      setTimeout(()=>{
        ball.style.animation='ball-wobble-seq 1.9s ease-in-out forwards';
        setTimeout(()=>playSfx('wobble'),140);
        setTimeout(()=>playSfx('wobble'),780);
        setTimeout(()=>playSfx('wobble'),1410);
        setTimeout(()=>{
          ball.style.animation='ball-pop 0.45s ease forwards';
          _spawnSparkles(sparkleHost);
          playSfx('gotcha');
          lbl.textContent=`Gotcha! ${PKM[pkIdx].n} was caught!`;
          setTimeout(()=>{
            ov.style.transition='opacity 0.4s ease';ov.style.opacity='0';
            setTimeout(()=>{ov.classList.remove('active');ov.style.cssText='';onDone();},400);
          },1200);
        },1900);
      },550);
    },750);
  },500);
}

function pickStarter(lineIdx){
  st.starter=lineIdx;
  st.phase='play';
  const startPi=LINES[lineIdx][0];
  st.team=[{pi:startPi,level:STARTER_START_LEVEL,xp:0}];
  st.activeIdx=0;
  st.pdx[startPi]=true;
  save();
  loadQuestion();
}

function switchPokemon(idx){
  if(idx===st.activeIdx)return;
  if(st.phase!=='play')return;
  st.activeIdx=idx;
  save();
  loadQuestion();
}

function applyLevelUps(){
  const tm=activeTM();if(!tm)return;
  while(tm.xp>=xpToNext(tm.level)){
    tm.xp-=xpToNext(tm.level);
    tm.level++;
    const evoAt=PKM[tm.pi].evoAt;
    if(evoAt&&tm.level>=evoAt){
      st.pendingEvo={fromPi:tm.pi,toPi:tm.pi+1};
      return;
    }
    st.lvlUpMsg=`${PKM[tm.pi].n} grew to level ${tm.level}!`;
  }
}

function processEvolution(){
  if(!st.pendingEvo){afterTurn();return;}
  const {fromPi,toPi}=st.pendingEvo;
  st.pendingEvo=null;
  playEvolution(fromPi,toPi,()=>{
    const tm=activeTM();
    tm.pi=toPi;
    st.pdx[toPi]=true;
    applyLevelUps();
    save();
    if(st.pendingEvo){processEvolution();}
    else{afterTurn();}
  });
}

function getAvailableOtherStarters(){
  const tm=activeTM();if(!tm)return[];
  const genIdx=genFromPi(tm.pi);
  const genLines=GENS[genIdx]||[];
  const teamPis=new Set(st.team.map(t=>t.pi));
  return genLines.map(li=>LINES[li][0]).filter(pi=>{
    const line=LINES.find(ln=>ln.includes(pi))||[];
    return !line.some(lpi=>teamPis.has(lpi));
  });
}
function triggerWildEncounter(){
  const tm=activeTM();
  const genIdx=genFromPi(tm.pi);
  const allWild=WILD_BY_GEN[genIdx]||[];
  const teamPis=new Set(st.team.map(t=>t.pi));
  const available=allWild.filter(pi=>!teamPis.has(pi));
  if(available.length===0){loadQuestion();return;}
  const wpi=available[Math.floor(Math.random()*available.length)];
  const minLv=Math.max(2,tm.level-3);
  const maxLv=Math.max(minLv,tm.level);
  const wlev=Math.floor(Math.random()*(maxLv-minLv+1))+minLv;
  st.wild={pi:wpi,level:wlev,correctStreak:0,misses:0};
  st.phase='wild';
  loadQuestion();
}

function afterTurn(){
  if(st.cor&&st.phase==='play'){
    const starterCands=getAvailableOtherStarters();
    if(starterCands.length>0&&Math.random()<STARTER_WILD_CHANCE){
      const wpi=starterCands[Math.floor(Math.random()*starterCands.length)];
      const tm=activeTM();
      const minLv=Math.max(2,tm.level-3),maxLv=Math.max(minLv,tm.level);
      st.wild={pi:wpi,level:Math.floor(Math.random()*(maxLv-minLv+1))+minLv,correctStreak:0,misses:0};
      st.phase='wild';
      loadQuestion();return;
    }
    if(Math.random()<WILD_CHANCE){triggerWildEncounter();return;}
  }
  loadQuestion();
}

function onNext(){
  if(st.phase==='wild'){
    if(st.wildEscape){
      st.wild=null;st.wildEscape=false;st.phase='play';
      loadQuestion();return;
    }
    if(st.wild&&st.wild.correctStreak>=CATCH_STREAK_NEEDED){
      const wp=st.wild.pi;const wlev=st.wild.level;
      playCatch(wp,()=>{
        st.team.push({pi:wp,level:wlev,xp:0});
        st.pdx[wp]=true;
        st.wild=null;
        st.phase='play';
        save();
        loadQuestion();
      });
      return;
    }
    loadQuestion();return;
  }
  if(st.pendingEvo){processEvolution();return;}
  afterTurn();
}

function handleAnswer(i){
  if(st.sel!==null)return;
  const ok=i===st.q.correctIndex;
  st.sel=i;st.cor=ok;
  updStats(st.q.subject,ok);
  if(ok){
    st.streak++;st.anim='bk';
    if(st.phase==='play'){
      const tm=activeTM();
      if(tm){tm.xp+=XP_PER_ANSWER;applyLevelUps();}
    } else if(st.phase==='wild'&&st.wild){
      st.wild.correctStreak++;
    }
  } else {
    st.streak=0;st.anim='sk';
    // A miss spends a ball but leaves the catch progress intact; only the last
    // ball running out lets it flee.
    if(st.phase==='wild'&&st.wild){
      st.wild.misses=(st.wild.misses||0)+1;
      if(st.wild.misses>CATCH_MISSES_ALLOWED)st.wildEscape=true;
    }
  }
  save();
  render();
}

document.getElementById("nav-game").addEventListener("click",()=>switchView('game'));
document.getElementById("nav-pdx").addEventListener("click",()=>switchView('pdx'));

// iPad swipe-away and tab close don't always fire a normal teardown
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});

gameEl.style.display="block";
document.getElementById("bottom-nav").style.display="flex";
// a restored game resumes straight into a fresh question; a new one picks a starter first
if(st.phase==='play')loadQuestion();else render();
</script>
